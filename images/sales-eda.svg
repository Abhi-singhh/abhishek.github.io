  <line x1="220" y1="130" x2="220" y2="330" stroke="#f4c67a" stroke-width="3"/>
  <line x1="220" y1="330" x2="520" y2="330" stroke="#f4c67a" stroke-width="3"/>
  <!-- bars -->
  <rect x="245" y="270" width="40" height="60" fill="#e8a33d"/>
  <rect x="300" y="230" width="40" height="100" fill="#e8a33d"/>
  <rect x="355" y="190" width="40" height="140" fill="#e8a33d"/>
  <rect x="410" y="150" width="40" height="180" fill="#e8a33d"/>
  <rect x="465" y="205" width="40" height="125" fill="#e8a33d"/>
  <!-- trend arrow -->
