  <circle cx="705" cy="300" r="12" fill="#e8a33d"/>
  <text x="400" y="390" text-anchor="middle" fill="#f4c67a" font-family="Arial, sans-serif" font-size="20" letter-spacing="2">BUYER PREFERENCE TRENDS</text>
</svg>
