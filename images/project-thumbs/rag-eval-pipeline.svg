<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="450" fill="#0b1e3c"/>
  <!-- stacked documents -->
  <g fill="none" stroke="#e8a33d" stroke-width="3">
    <rect x="110" y="140" width="120" height="150" rx="6" fill="#13294b"/>
    <rect x="130" y="120" width="120" height="150" rx="6" fill="#13294b"/>
    <rect x="150" y="100" width="120" height="150" rx="6" fill="#0b1e3c"/>
  </g>
  <g stroke="#f4c67a" stroke-width="4" stroke-linecap="round">
    <line x1="175" y1="135" x2="245" y2="135"/>
    <line x1="175" y1="160" x2="245" y2="160"/>
    <line x1="175" y1="185" x2="220" y2="185"/>
  </g>
  <!-- arrow -->
  <path d="M300 200 L470 200" stroke="#e8a33d" stroke-width="4" fill="none"/>
  <polygon points="470,190 495,200 470,210" fill="#e8a33d"/>
  <!-- chat bubble node -->
  <rect x="520" y="140" width="180" height="120" rx="16" fill="#13294b" stroke="#e8a33d" stroke-width="3"/>
  <polygon points="560,260 560,290 600,260" fill="#13294b" stroke="#e8a33d" stroke-width="3"/>
  <g stroke="#f4c67a" stroke-width="4" stroke-linecap="round">
    <line x1="545" y1="175" x2="675" y2="175"/>
    <line x1="545" y1="200" x2="675" y2="200"/>
    <line x1="545" y1="225" x2="630" y2="225"/>
  </g>
  <text x="400" y="360" text-anchor="middle" fill="#f4c67a" font-family="Arial, sans-serif" font-size="20" letter-spacing="2">RETRIEVAL → GENERATION → EVAL</text>
</svg>
